name: Metals Trigger Diagnostic

'on':
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/diagnostic-metals.yml"

permissions:
  contents: read

jobs:
  trigger-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm workflow trigger and runner
        run: |
          echo "DIAGNOSTIC WORKFLOW STARTED"
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "run_id=${{ github.run_id }}"
          echo "run_number=${{ github.run_number }}"
          echo "runner=$RUNNER_OS"
          date -u
          echo "If this log exists, trigger and runner provisioning are functioning."
