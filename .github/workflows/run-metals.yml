name: Metals Daily Reporter

run-name: Metals Reporter - ${{ github.event_name }} - ${{ github.run_number }}

on:
  schedule:
    - cron: "10 9 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: metals-reporter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Diagnóstico do ambiente
        run: |
          echo "Evento: ${{ github.event_name }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Run: ${{ github.run_number }}"
          echo "Runner: $RUNNER_OS"
          python --version || true
          git --version
          git status --short

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
          pip list

      - name: Validar secrets
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_METALS: ${{ secrets.TELEGRAM_CHAT_ID_METALS }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then echo "::error::TELEGRAM_BOT_TOKEN ausente"; exit 1; fi
          if [ -z "$TELEGRAM_CHAT_ID_METALS" ]; then echo "::error::TELEGRAM_CHAT_ID_METALS ausente"; exit 1; fi
          echo "Secrets obrigatórios presentes (valores ocultos)."

      - name: Executar pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_METALS: ${{ secrets.TELEGRAM_CHAT_ID_METALS }}
        run: python -u run_all.py

      - name: Salvar snapshot
        if: success()
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add snapshot.json
          if git diff --staged --quiet; then
            echo "Snapshot sem alterações."
          else
            git commit -m "chore: update snapshot [skip ci]"
            git push origin HEAD:main
          fi
