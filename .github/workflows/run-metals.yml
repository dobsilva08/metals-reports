name: Metals Daily Reporter
run-name: Metals Reporter / ${{ github.event_name }} / ${{ github.run_number }}

'on':
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: "Executar apenas diagnóstico, sem coletar ou enviar"
        required: false
        type: boolean
        default: false
  schedule:
    - cron: "12 9 * * *" # 06:12 BRT — staggered
  push:
    branches:
      - main
    paths-ignore:
      - snapshot.json

permissions:
  contents: write

concurrency:
  group: metals-reporter-main
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Diagnóstico do runner
        run: |
          echo "event=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "sha=${{ github.sha }}"
          echo "run_id=${{ github.run_id }}"
          echo "run_number=${{ github.run_number }}"
          echo "runner_os=$RUNNER_OS"
          echo "utc=$(date -u)"
          echo "python path=$(command -v python || true)"
          echo "git version=$(git --version)"
          git status --short
          python --version

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Diagnóstico básico (sem secrets)
        run: |
          python - <<'PY'
          import sys, ssl, urllib.request
          print("Python:", sys.version)
          print("SSL:", ssl.OPENSSL_VERSION)
          for url in ("https://pypi.org", "https://query1.finance.yahoo.com"):
              try:
                  with urllib.request.urlopen(url, timeout=10) as r:
                      print(url, "HTTP", r.status)
              except Exception as e:
                  print(url, "ERROR", repr(e))
          PY

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
          pip list

      - name: Validar secrets
        if: ${{ !inputs.diagnostic_only }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_METALS: ${{ secrets.TELEGRAM_CHAT_ID_METALS }}
        run: |
          [ -n "$TELEGRAM_BOT_TOKEN" ] || { echo "::error::TELEGRAM_BOT_TOKEN ausente"; exit 1; }
          [ -n "$TELEGRAM_CHAT_ID_METALS" ] || { echo "::error::TELEGRAM_CHAT_ID_METALS ausente"; exit 1; }
          echo "Secrets presentes."

      - name: Pipeline
        if: ${{ !inputs.diagnostic_only }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_METALS: ${{ secrets.TELEGRAM_CHAT_ID_METALS }}
        run: python -u run_all.py

      - name: Diagnóstico concluído
        if: ${{ inputs.diagnostic_only }}
        run: echo "Diagnóstico executado. Pipeline de coleta e envio foi ignorado."

      - name: Salvar snapshot
        if: ${{ success() && !inputs.diagnostic_only }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add snapshot.json
          if git diff --staged --quiet; then
            echo "Snapshot sem alterações."
          else
            git commit -m "chore: update snapshot [skip ci]"
            git push origin HEAD:main
          fi
