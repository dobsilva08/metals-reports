name: Metals Reporter Recovery
run-name: Metals Recovery / ${{ github.event_name }} / ${{ github.run_number }}

on:
  workflow_dispatch:
    inputs:
      diagnostic_only:
        description: "Testar runner e dependências sem envio Telegram"
        type: boolean
        required: false
        default: true
  push:
    branches: [main]
    paths:
      - ".github/workflows/metals-recovery.yml"

permissions:
  contents: write

jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Diagnóstico de runner e conectividade
        run: |
          set -eux
          echo "Recovery workflow executing"
          echo "Event: ${{ github.event_name }}"
          echo "SHA: ${{ github.sha }}"
          python --version
          git --version
          python - <<'PY'
          import urllib.request
          for url in ["https://pypi.org", "https://query1.finance.yahoo.com"]:
              try:
                  r=urllib.request.urlopen(url, timeout=15)
                  print(url, r.status)
              except Exception as e:
                  print(url, type(e).__name__, e)
          PY

      - name: Install dependencies
        run: |
          set -eux
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check

      - name: Python import validation
        run: |
          python - <<'PY'
          import pandas, requests, yfinance
          print("pandas", pandas.__version__)
          print("requests", requests.__version__)
          print("yfinance", yfinance.__version__)
          import collector_unified, report_unified, telegram_sender
          print("Project imports: OK")
          PY

      - name: Diagnostic-only exit
        if: ${{ inputs.diagnostic_only == true }}
        run: echo "Runner, network probe, dependency installation, and project imports passed. Pipeline intentionally not run."

      - name: Validate Telegram secrets
        if: ${{ inputs.diagnostic_only != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_METALS: ${{ secrets.TELEGRAM_CHAT_ID_METALS }}
        run: |
          set -eux
          test -n "$TELEGRAM_BOT_TOKEN"
          test -n "$TELEGRAM_CHAT_ID_METALS"

      - name: Run metals pipeline
        if: ${{ inputs.diagnostic_only != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID_METALS: ${{ secrets.TELEGRAM_CHAT_ID_METALS }}
        run: python -u run_all.py

      - name: Commit snapshot
        if: ${{ success() && inputs.diagnostic_only != true }}
        run: |
          set -eux
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add snapshot.json
          if git diff --staged --quiet; then
            echo "No snapshot changes."
          else
            git commit -m "chore: update metals snapshot [skip ci]"
            git push origin HEAD:main
          fi
